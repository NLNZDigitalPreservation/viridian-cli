[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viridian-cli"
version = "2.0.0"
description = "Viridian CLI for simulator, fixity, dashboard and http-proxy container workflows"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.9"

authors = [
    { name = "Frank Lee", email = "frank.lee@dia.govt.nz" },
]

dependencies = [
    "orjson~=3.11.5",
    "requests~=2.32.5",
    "psutil~=7.1.3",
    "plotext~=5.3.2",
    "rich~=14.2.0",
    "requests-unixsocket~=0.4.1",
    "aiohttp~=3.13.2",
    "docker~=7.1.0",
    "azure-storage-blob~=12.28.0",
    "oracledb~=3.4.2",
    "python-dotenv~=1.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"viridian" = [
    "resources/*",
    "resources/**/*",
]

[project.scripts]
fixity = "viridian.cli_fixity:main"
pyaz = "pyaz.cli:main"
