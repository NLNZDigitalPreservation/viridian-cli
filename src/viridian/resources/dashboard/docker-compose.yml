services:
  dashboard:
    image: acrdiaanlnzndev.azurecr.io/deposit-dashboard:${app_version}
    command: --spring.config.additional-location=file:/usr/local/dashboard/
    container_name: dashboard
    hostname: dashboard
    restart: always
    ports:
      - "8081:1901"
    environment:
      - PERSIST_PATH=${PERSIST_PATH:-/data/persistent/dashboard}
    volumes:
      - ${SOURCE_INSTALL_PATH}:/usr/local/dashboard
      - /mnt/ndha-pre-deposit/:/mnt/ndha-pre-deposit/
