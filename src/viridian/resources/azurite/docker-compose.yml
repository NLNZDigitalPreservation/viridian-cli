networks:
  viridian-network:
    external: true

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:${AZURITE_VERSION:-latest}
    command: "node /usr/local/bin/azurite -l /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck"
    container_name: "azurite"
    hostname: azurite
    restart: always
    security_opt:
      - label=disable
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "0.0.0.0:10000:10000"
      - "0.0.0.0:10001:10001"
      - "0.0.0.0:10002:10002"
    volumes:
      - ${SOURCE_PERSISTENT_PATH}:/data
    networks:
      - viridian-network
