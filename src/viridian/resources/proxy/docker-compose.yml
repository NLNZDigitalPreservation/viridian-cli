networks:
  viridian-network:
    external: true
services:
  proxy:
    image: acrdiaanlnzndev.azurecr.io/http-proxy:${PROXY_VERSION:-latest}
    command: /etc/nginx/run.sh
    container_name: proxy
    hostname: proxy
    restart: always
    security_opt:
      - label=disable
    ports:
      - "8443:8443"
    networks:
      - viridian-network
    environment:
      - ENV_NAME=${ENV_NAME:-dev}
    volumes:
      - ${SOURCE_INSTALL_PATH:-/data/viridian/conf/proxy}:/data/certs
