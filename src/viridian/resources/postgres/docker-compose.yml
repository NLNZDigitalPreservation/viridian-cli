networks:
  viridian-network:
    external: true
services:
  postgres:
    image: acrdiaanlnzndev.azurecr.io/fixity-postgres:${POSTGRES_VERSION:-latest}
    container_name: "postgres"
    restart: always
    security_opt:
      - label=disable
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "0.0.0.0:5432:5432"
    networks:
      - viridian-network
    environment:
      - POSTGRES_DB=fixity
      - POSTGRES_USER=fixity
      - POSTGRES_PASSWORD=fixity
      - PGDATA=/persistent/postgres/database
    volumes:
      - ${SOURCE_PERSISTENT_PATH}:/persistent/postgres
